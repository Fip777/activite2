        <div class="card">
          <p id="instruction"></p>

				<path
				  d="M16 4C10.89 4 6.62 7.16 4.88 11.63L6.72 12.38C8.18 8.64 11.71 6 16 6C19.24 6 22.13 7.59 23.94 10H20V12H27V5H25V8.09C22.81 5.58 19.57 4 16 4ZM25.28 19.63C23.82 23.36 20.29 26 16 26C12.72 26 9.84 24.39 8.03 22H12V20H5V27H7V23.91C9.19 26.39 12.39 28 16 28C21.11 28 25.38 24.84 27.13 20.38Z"
				  fill="black"
				/>
			  </svg>
			</button>
        </div>      
      </div>
    </div>

    <button id="finish" type="button">Terminer</button>
  </section>
